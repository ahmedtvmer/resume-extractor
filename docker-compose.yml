version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-extractor
    ports:
      - "8000:8000"
    environment:
      - RESUME_MODEL_PATH=/app/final-resume-model
      - MONGO_URL=mongodb://admin:password123@mongodb:27017
      - DATABASE_NAME=resume_extraction
      - MAX_UPLOAD_SIZE_MB=10
      # AWS credentials (uncomment for deployment)
      # - AWS_ACCESS_KEY_ID=your_key
      # - AWS_SECRET_ACCESS_KEY=your_secret
      # - AWS_REGION=us-east-1
      # - S3_BUCKET_NAME=your-bucket
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongodb-local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data:
